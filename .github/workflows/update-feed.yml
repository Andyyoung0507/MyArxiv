name: Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Adjust refresh schedule here. By default, it runs once per day.
    # Syntax reference: https://docs.github.com/en/actions/reference/events-that-trigger-workflows#schedule
    # Recommended tool: https://crontab.guru/
    - cron: "12 5 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Download ArxivFeed Source
        env:
          GITHUB_PAT: ${{ github.token }}
          REPO: "NotCraft/ArxivFeed"
          VERSION: "v0.1.4"
        shell: bash
        run: |
          curl -sL --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
              "https://api.github.com/repos/${REPO}/tarball/${VERSION}" \
              -o arxivfeed-src.tgz
          mkdir arxivfeed-src
          tar -zxvf arxivfeed-src.tgz --strip-components 1 -C arxivfeed-src
      - name: Patch ArxivFeed
        shell: bash
        run: patch -p1 -d arxivfeed-src < patches/arxivfeed-rate-limit.patch
      - name: Refresh Rhai Runtime
        working-directory: arxivfeed-src
        run: cargo update -p rhai --precise 1.24.0
      - name: Build ArxivFeed
        working-directory: arxivfeed-src
        run: cargo build --release
      - name: Build rss
        env:
          ARXIVFEED_USER_AGENT: "MyArxiv/1.0 (+https://github.com/${{ github.repository }})"
        run: ./arxivfeed-src/target/release/arxivfeed
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          force_orphan: true
